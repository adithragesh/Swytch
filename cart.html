<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swytch | Cart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <button class="nav-icon" id="menu-toggle">
        <i class="fas fa-bars"></i>
      </button>
      <a href="index.html" class="logo">SWYTCH</a>
    </div>
    <div class="nav-right">
      <a href="wishlist.html" class="nav-icon cart-icon">
        <i class="far fa-heart"></i>
        <span class="cart-count" style="display:none">0</span>
      </a>
      <a href="cart.html" class="nav-icon cart-icon">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" style="display:none">0</span>
      </a>
    </div>
  </nav>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  
  <!-- Slide-in Menu -->
  <div class="mobile-menu" id="mobile-menu">
    <button class="close-btn" id="close-menu"><i class="fas fa-times"></i></button>
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="shop.html"><i class="fas fa-shopping-bag"></i> Shop</a>
    <a href="styles.html"><i class="fas fa-magic"></i> Aesthetics</a>
    <a href="wishlist.html"><i class="far fa-heart"></i> Wishlist</a>
    <a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a>
    <a href="orders.html"><i class="fas fa-box"></i> My Orders</a>
    <a href="track.html"><i class="fas fa-map-marker-alt"></i> Track My Order</a>
    <a href="login.html"><i class="fas fa-user"></i> Login</a>
  </div>

  <div class="container full-height" style="max-width: 1000px; padding-top: 40px;">
    <h1 class="mb-40">Shopping Cart</h1>
    
    <div class="cart-layout fade-in">
      <div class="cart-items" id="cart-items-container">
        <!-- Dynamically injected via app.js -->
      </div>
      
      <div class="cart-summary">
        <h2 class="mb-20">Summary</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span>Calculated at checkout</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="cart-total">$0.00</span>
        </div>
        <button class="btn-primary full-width mt-20" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-logo">SWYTCH</div>
    <div class="footer-links">
      <a href="#">About Us</a>
      <a href="#">Contact</a>
      <a href="#">FAQ</a>
      <a href="#">Shipping</a>
    </div>
    <p>&copy; 2026 Swytch. All rights reserved.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
