<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swytch | Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <button class="nav-icon" id="menu-toggle">
        <i class="fas fa-bars"></i>
      </button>
      <a href="index.html" class="logo">SWYTCH</a>
    </div>
    <div class="nav-right">
      <a href="wishlist.html" class="nav-icon cart-icon">
        <i class="far fa-heart"></i>
        <span class="cart-count" style="display:none">0</span>
      </a>
      <a href="cart.html" class="nav-icon cart-icon">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" style="display:none">0</span>
      </a>
    </div>
  </nav>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  
  <!-- Slide-in Menu -->
  <div class="mobile-menu" id="mobile-menu">
    <button class="close-btn" id="close-menu"><i class="fas fa-times"></i></button>
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="shop.html"><i class="fas fa-shopping-bag"></i> Shop</a>
    <a href="styles.html"><i class="fas fa-magic"></i> Aesthetics</a>
    <a href="wishlist.html"><i class="far fa-heart"></i> Wishlist</a>
    <a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a>
    <a href="orders.html"><i class="fas fa-box"></i> My Orders</a>
    <a href="track.html"><i class="fas fa-map-marker-alt"></i> Track My Order</a>
    <a href="login.html"><i class="fas fa-user"></i> Login</a>
  </div>

  <div class="container full-height">
    <div class="auth-container">
      <h2 class="text-center mb-40">Welcome Back</h2>
      
      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px;">Email</label>
        <input type="email" class="input-dark" placeholder="Enter your email">
      </div>
      
      <div style="margin-bottom: 30px;">
        <label style="display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px;">Password</label>
        <input type="password" class="input-dark" placeholder="Enter your password">
      </div>
      
      <button class="btn-primary full-width mb-20" onclick="window.location.href='index.html'">Sign In</button>
      
      <p class="text-center" style="font-size: 14px;">Don't have an account? <a href="#" style="color: var(--primary); font-weight: bold;">Sign Up</a></p>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-logo">SWYTCH</div>
    <div class="footer-links">
      <a href="#">About Us</a>
      <a href="#">Contact</a>
      <a href="#">FAQ</a>
      <a href="#">Shipping</a>
    </div>
    <p>&copy; 2026 Swytch. All rights reserved.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
