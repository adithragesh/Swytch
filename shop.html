<!DOCTYPE html>
<html lang="en">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">

      </button>
      <a href="index.html" class="logo">SWYTCH</a>
    </div>
    <div class="nav-right">
      <a href="wishlist.html" class="nav-icon cart-icon">
        <i class="far fa-heart"></i>
        <span class="cart-count" style="display:none">0</span>
      </a>
      <a href="cart.html" class="nav-icon cart-icon">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" style="display:none">0</span>
      </a>
    </div>
  </nav>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  
  <!-- Slide-in Menu -->
  <div class="mobile-menu" id="mobile-menu">
    <button class="close-btn" id="close-menu"><i class="fas fa-times"></i></button>

    <p class="text-center mb-40">Curated specifically for your aesthetic</p>
    
    <div class="product-grid" id="shop-grid">

  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-logo">SWYTCH</div>
    <div class="footer-links">
      <a href="#">About Us</a>
