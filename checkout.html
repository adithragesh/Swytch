<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swytch | Checkout</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <button class="nav-icon" id="menu-toggle">
        <i class="fas fa-bars"></i>
      </button>
      <a href="index.html" class="logo">SWYTCH</a>
    </div>
    <div class="nav-right">
      <a href="wishlist.html" class="nav-icon cart-icon">
        <i class="far fa-heart"></i>
        <span class="cart-count wishlist-count" style="display:none">0</span>
      </a>
      <a href="cart.html" class="nav-icon cart-icon">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" style="display:none">0</span>
      </a>
    </div>
  </nav>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  
  <!-- Slide-in Menu -->
  <div class="mobile-menu" id="mobile-menu">
    <button class="close-btn" id="close-menu"><i class="fas fa-times"></i></button>
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="shop.html"><i class="fas fa-shopping-bag"></i> Shop</a>
    <a href="styles.html"><i class="fas fa-magic"></i> Aesthetics</a>
    <a href="wishlist.html"><i class="far fa-heart"></i> Wishlist</a>
    <a href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a>
    <a href="orders.html"><i class="fas fa-box"></i> My Orders</a>
    <a href="track.html"><i class="fas fa-map-marker-alt"></i> Track My Order</a>
    <a href="login.html"><i class="fas fa-user"></i> Login</a>
  </div>

  <div class="container checkout-container fade-in">
    <div class="checkout-step">
      <h2>Shipping Information</h2>
      <form id="shipping-form" action="payment.html" method="GET">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
          <input type="text" id="fname" class="input-dark" placeholder="First Name" required>
          <input type="text" id="lname" class="input-dark" placeholder="Last Name" required>
        </div>
        <div style="margin-bottom: 15px;">
          <input type="tel" id="phone" class="input-dark" placeholder="Phone Number" required>
        </div>
        <div style="margin-bottom: 15px;">
          <input type="text" id="address" class="input-dark" placeholder="Street Address" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 30px;">
          <input type="text" id="city" class="input-dark" placeholder="City" required>
          <input type="text" id="state" class="input-dark" placeholder="State/Province" required>
          <input type="text" id="zip" class="input-dark" placeholder="ZIP/Postal Code" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; padding: 18px; font-size: 18px;">Continue to Payment</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-logo">SWYTCH</div>
    <div class="footer-links">
      <a href="#">About Us</a>
      <a href="#">Contact</a>
      <a href="#">FAQ</a>
      <a href="#">Shipping</a>
    </div>
    <p>&copy; 2026 Swytch. All rights reserved.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
